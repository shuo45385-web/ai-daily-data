name: Generate daily AI projects

on:
  schedule:
    # 00:10 UTC = 每天北京时间 08:10。GitHub 定时任务可能有数分钟延迟。
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '要生成的日期（yyyy-MM-dd，留空则使用北京时间当天）'
        required: false
        type: string
      force:
        description: '当同日期文件已经存在时覆盖它'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate data file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=""
          if [ -n "${{ inputs.date }}" ]; then args="$args --date ${{ inputs.date }}"; fi
          if [ "${{ inputs.force }}" = "true" ]; then args="$args --force"; fi
          node scripts/generate-daily-ai.mjs $args
      - name: Commit generated data
        run: |
          if git diff --quiet -- data; then
            echo "没有需要提交的数据变更"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "daily: $(TZ=Asia/Shanghai date +%F)"
          git push
